name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: agent_revision_lab_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_revision_lab_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ARL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_revision_lab_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:integration
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Build and start the persistent Compose demo
        run: docker compose up -d --build --wait
      - name: Verify the Compose API and worker
        run: node scripts/api-smoke.mjs
      - name: Stop the Compose demo
        if: always()
        run: docker compose down
